/* ---- bitcrusher via ScriptProcessor ---- */
function makeCrusher(){
  var bits=6, norm=Math.pow(2,bits-1), step=4;  // step = downsample factor
  var node=(AC.createScriptProcessor||AC.createJavaScriptNode).call(AC,1024,2,2);
  var hold=[0,0], cnt=0;
  node.onaudioprocess=function(e){
    var ch;
    for(ch=0;ch<e.inputBuffer.numberOfChannels;ch++){
      var inp=e.inputBuffer.getChannelData(ch);
      var out=e.outputBuffer.getChannelData(ch);
      for(var i=0;i<inp.length;i++){
        if(ch===0){ if(i%step===0){ hold[0]=Math.round(inp[i]*norm)/norm; } out[i]=hold[0]; }
        else      { if(i%step===0){ hold[1]=Math.round(inp[i]*norm)/norm; } out[i]=hold[1]; }
      }
    }
  };
  return node;
}
function buildMusicChain(){
  if(!AC||!trackEl||srcNode) return;
  try{
    srcNode=AC.createMediaElementSource(trackEl);
  }catch(e){ srcNode=null; return; }
  cleanG=AC.createGain(); cleanG.gain.value=1;
  crushG=AC.createGain(); crushG.gain.value=0;
  crusher=makeCrusher();
  crushLP=AC.createBiquadFilter(); crushLP.type='lowpass'; crushLP.frequency.value=3400; crushLP.Q.value=0.7;
  // clean path
  srcNode.connect(cleanG); cleanG.connect(master);
  // crushed path
  srcNode.connect(crusher); crusher.connect(crushLP); crushLP.connect(crushG); crushG.connect(master);
}
function setCrushed(on){
  if(!cleanG||!crushG){ return; }
  var t=AC.currentTime, r=0.35;
  var wantCrush = on && crushOn;
  cleanG.gain.cancelScheduledValues(t);
  crushG.gain.cancelScheduledValues(t);
  cleanG.gain.setTargetAtTime(wantCrush?0:1, t, r/3);
  crushG.gain.setTargetAtTime(wantCrush?1:0, t, r/3);
}

/* ---- chip sfx ---- */
function blip(f,dur,type,vol,to){
  if(!AC||!soundOn) return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,AC.currentTime);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to),AC.currentTime+dur);
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.25,AC.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g); g.connect(sfxG); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noise(dur,vol,f,type){
  if(!AC||!soundOn||!noiseBuf) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var fl2=AC.createBiquadFilter(); fl2.type=type||'bandpass'; fl2.frequency.value=f||900; fl2.Q.value=1.1;
  var g=AC.createGain();
  g.gain.setValueAtTime(vol||0.3,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.connect(fl2); fl2.connect(g); g.connect(sfxG); s.start(); s.stop(AC.currentTime+dur+0.02);
}

function musicTick(){
  if(!AC||!soundOn||!mus.on) return;
  var bar=Math.floor(mus.step/8)%4,s=mus.step%8,ch=CH[bar];
  if(s===0||s===4){var o=AC.createOscillator(),g=AC.createGain();
   o.type='triangle';o.frequency.value=BASS[bar];

   o.connect(g);g.connect(synthG);o.start();o.stop(AC.currentTime+0.45);}
  var pat=[0,1,2,1,0,2,1,2];
  var og=AC.createOscillator(),gg=AC.createGain();
  og.type='square';og.frequency.value=ch[pat[s]]*(s>=4&&mus.lvl>0.45?2:1);
  gg.gain.setValueAtTime(0.0001,AC.currentTime);
  gg.gain.exponentialRampToValueAtTime(0.10+mus.lvl*0.07,AC.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.20);

  if(s===0||s===3||s===6){var k=AC.createOscillator(),kg=AC.createGain();
   k.type='sine';k.frequency.setValueAtTime(120,AC.currentTime);
   k.frequency.exponentialRampToValueAtTime(45,AC.currentTime+0.11);
   kg.gain.setValueAtTime(0.30,AC.currentTime);
   kg.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.14);
   k.connect(kg);kg.connect(synthG);k.start();k.stop(AC.currentTime+0.16);}
  if(s%2===1){var hs=AC.createBufferSource();hs.buffer=noiseBuf;
   var hf=AC.createBiquadFilter();hf.type='highpass';hf.frequency.value=6500;
   var hg=AC.createGain();hg.gain.setValueAtTime(0.055,AC.currentTime);

function step(){

  if(Math.random()<0.005){lit=7;fl.style.opacity='0.42';SFX.thunder();
   setTimeout(function(){fl.style.opacity='0';},70);}
  var ax=0;
  if(K.l){ax-=MOVE;p.face=-1;}
  if(K.r){ax+=MOVE;p.face=1;}
  var alt=-p.y/PPM;
  if(alt>peak){score+=(alt-peak)*mul;peak=alt;}
  mus.lvl=Math.min(peak/260,1);
  if(rainGain)rainGain.gain.value=0.05+mus.lvl*0.045;
  p.vx=ax+(alt>14?gust:0);
  if(K.j&&p.grd){p.vy=JUMP;p.grd=false;p.fallY=p.y;p.falling=true;SFX.jump();}
  p.vy=Math.min(p.vy+GRAV,TERM);
  if(!p.grd&&p.vy>0&&!p.falling){p.falling=true;p.fallY=p.y;}
  p.x+=p.vx;
  if(p.x<2)p.x=2;
  if(p.x>W-PLW-2)p.x=W-PLW-2;
  var py=p.y;p.y+=p.vy;p.grd=false;
  for(var i=0;i<plats.length;i++){

      if(py+PLH<=s.y+2&&p.y+PLH>=s.y&&p.vy>=0){
        p.y=s.y-PLH;p.vy=0;p.grd=true;
        if(p.falling){p.falling=false;land();}
        if(s.t==='r'&&mul>bestMul){bestMul=mul;SFX.bank();showToast('BANKED x'+mul.toFixed(1),'#5affa8');}
      }}}

    var q=cells[j];
    if(!q.got&&Math.abs(p.x+PLW/2-q.x)<18&&Math.abs(p.y+PLH/2-q.y)<20){

  cx.strokeStyle='rgba(150,180,220,.16)';cx.lineWidth=1;cx.beginPath();
  for(var i=0;i<rain.length;i++){var r=rain[i];r.y+=r.s;r.x-=1.7;
   if(r.y>H){r.y=-14;r.x=Math.random()*(W+60);}
   if(r.x<-20)r.x=W+20;cx.moveTo(r.x,r.y);cx.lineTo(r.x-2.5,r.y+r.l);}
  cx.stroke();
  cx.save();cx.translate(0,-cam);
  cx.strokeStyle='rgba(70,86,112,.42)';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(W/2-16,50);cx.lineTo(W/2-16,topY);cx.stroke();
  cx.beginPath();cx.moveTo(W/2+16,50);cx.lineTo(W/2+16,topY);cx.stroke();
  cx.strokeStyle='rgba(70,86,112,.22)';cx.lineWidth=2;
  for(var y=Math.min(50,cam+H*2);y>Math.max(topY,cam-60);y-=26){
    cx.beginPath();cx.moveTo(W/2-16,y);cx.lineTo(W/2+16,y-13);cx.stroke();
    cx.beginPath();cx.moveTo(W/2+16,y);cx.lineTo(W/2-16,y-13);cx.stroke();}
  for(var k=0;k<plats.length;k++){
    var s=plats[k];
    if(s.y-cam<-80||s.y-cam>H+80)continue;
    if(s.t==='g'){cx.fillStyle='#0d1119';cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#1b2231';cx.fillRect(s.x,s.y,s.w,3);}
    else if(s.t==='r'){cx.fillStyle='#1d3a2e';cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#5affa8';cx.fillRect(s.x,s.y,s.w,2);}
    else{cx.fillStyle='#1a212e';cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#2c3646';cx.fillRect(s.x,s.y,s.w,2);}}
  for(var n=0;n<cells.length;n++){
    var q=cells[n];
    if(q.got||q.y-cam<-60||q.y-cam>H+60)continue;
    q.ph+=0.08;
    cx.save();cx.translate(q.x,q.y+Math.sin(q.ph)*3);
    cx.shadowColor='#5ad8ff';cx.shadowBlur=13;cx.fillStyle='#5ad8ff';
    cx.fillRect(-5,-5,10,10);cx.shadowBlur=0;
    cx.fillStyle='#04121a';cx.fillRect(-2,-2,4,4);cx.restore();}
  if(!(respawnT>0&&Math.floor(respawnT/4)%2===0)){
    cx.save();cx.translate(p.x,p.y);
    cx.fillStyle='#11151d';cx.fillRect(0,6,PLW,PLH-6);
    cx.fillStyle='#1b2230';cx.fillRect(0,6,PLW,4);
    cx.fillStyle='#c9a86a';cx.fillRect(PLW/2-1,9,2,6);
    cx.fillStyle='#2a3040';cx.fillRect(1,0,PLW-2,7);
    cx.shadowColor='#5ad8ff';cx.shadowBlur=9;cx.fillStyle='#7ce4ff';
    cx.fillRect(p.face>0?PLW-5:2,2,3,2);
    cx.restore();}
  cx.restore();cx.restore();
}
function loop(){if(st==='play')step();draw();requestAnimationFrame(loop);}

/* ---- boot: find the file, then set the menu up ---- */
setSound(soundOn); setCrush(crushOn);
probeNext(function(name){
  if(name){
    foundName=name; usingTrack=true;
    trackEl=new Audio(); trackEl.src=name; trackEl.loop=true; trackEl.preload='auto';
    trackEl.crossOrigin='anonymous';
    trackEl.load();
    nowp.innerHTML='&#9834; '+TRACK_TITLE+' &mdash; TAP TO HEAR IT';
  } else {
    usingTrack=false;
    nowp.innerHTML='&#9834; CHIPTUNE MODE &mdash; no audio file found';
  }
});
// first user gesture anywhere unlocks + starts menu music
function firstGesture(){
  initAudio(); resumeAudio();
  if(usingTrack&&!srcNode){ buildMusicChain(); }
  if(st==='menu'||st==='dead') menuMusic();
  document.removeEventListener('touchstart',firstGesture);
  document.removeEventListener('mousedown',firstGesture);
  document.removeEventListener('keydown',firstGesture);
}
document.addEventListener('touchstart',firstGesture,{passive:true});
document.addEventListener('mousedown',firstGesture);
document.addEventListener('keydown',firstGesture);

build(); st='menu'; loop();
})();
