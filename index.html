<title>POLYBIUS</title>
<!--
 ====================================================================
 POLYBIUS - TOWER  |  D21 Arcade minigame reference build
 The Counterfeit Ian Ackley Experience
 ====================================================================
 AUDIO SETUP - IMPORTANT
 Put the song in the SAME FOLDER as this file. Any of these names work:

      track.mp3                        <- SAFEST, use this
      insert-coin-invert-minds.mp3
      insert-coin;-invert-minds.mp3

 If it still will not play, RENAME your file to exactly  track.mp3
 A semicolon in a filename breaks in URLs on some browsers, which is
 the most common reason audio fails to load.

 HOW THE MUSIC BEHAVES
 - MENU  : full quality, full volume
 - GAME  : routed through a real bitcrusher (about 6-bit, downsampled)
           and lowered so sfx and rain sit on top
 - OVER  : snaps back to full quality
 Tap CRUSH in the corner to hear it clean during play.
 If no file is found it falls back to a synthesised chip loop.
 ====================================================================
-->
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html,body{height:100%;width:100%;overflow:hidden;background:#05060a;position:fixed;font-family:ui-monospace,"SF Mono",Menlo,monospace;overscroll-behavior:none;}
canvas{display:block;position:absolute;top:0;left:0;touch-action:none;}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;display:flex;justify-content:space-between;pointer-events:none;z-index:5;}
#sc{color:#5ad8ff;font-size:25px;font-weight:700;letter-spacing:1px;text-shadow:0 0 14px rgba(90,216,255,.55);line-height:1;}

#right{text-align:right;}
#lives{font-size:13px;letter-spacing:3px;color:#ff4a4a;text-shadow:0 0 8px rgba(255,74,74,.5);}
#hp{width:80px;height:5px;background:#161b26;border:1px solid #2e3644;margin-top:6px;margin-left:auto;}
#hpf{height:100%;width:100%;background:linear-gradient(90deg,#ff3b3b,#ff9a4a);}
#mul{color:#ffb84a;font-size:11px;font-weight:700;margin-top:4px;}
#actrl{position:absolute;top:calc(env(safe-area-inset-top) + 3px);left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:7;align-items:flex-start;}

.ab .ic{font-size:14px;display:block;}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,5,9,.96);z-index:20;text-align:center;padding:20px;overflow-y:auto;}
#ttl{font-size:15px;letter-spacing:6px;margin-bottom:2px;color:#5ad8ff;}
#ttl b{color:#ff4a4a;}
#sub2{color:#e8edf5;font-size:10px;letter-spacing:2px;margin-bottom:10px;font-weight:400;}
#nowp{color:#5affa8;font-size:8px;letter-spacing:2px;margin-bottom:10px;min-height:11px;}

#big{font-size:40px;color:#5ad8ff;font-weight:700;letter-spacing:2px;margin:2px 0;text-shadow:0 0 20px rgba(90,216,255,.5);}
.k{color:#5ad8ff;}
#board{width:244px;margin:6px 0 4px;border-top:1px solid #232b3a;border-bottom:1px solid #232b3a;padding:8px 0;}
#board .bh{color:#ffb84a;font-size:8px;letter-spacing:3px;margin-bottom:7px;}
.row{display:flex;justify-content:space-between;font-size:11px;padding:2px 6px;color:#8c96a7;}

.row span:nth-child(2){flex:1;text-align:left;letter-spacing:1px;}

@keyframes bk{0%,49%{opacity:1}50%,100%{opacity:0}}

.pad{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);width:78px;height:78px;border:2px solid rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-size:22px;background:rgba(255,255,255,.05);}
#pl{left:14px;} #pr{left:102px;} #pj{right:14px;width:94px;height:94px;}
.pad.on{background:rgba(90,216,255,.28);border-color:#5ad8ff;}

<body>
<canvas id="c"></canvas>
<div id="fl"></div>
<div id="toast"></div>
<div id="actrl">
  <div class="ab on" id="bSnd"><span class="ic">&#9834;</span><span id="lSnd">SOUND</span></div>
  <div class="ab on" id="bCr"><span class="ic">&#9636;</span><span>CRUSH</span></div>
</div>
<div id="hud">
  <div><div id="sc">0</div><div class="lb">SCORE</div></div>
  <div id="right"><div id="lives">&#9679;&#9679;&#9679;</div><div class="lb">LIVES</div>
    <div id="mul">x1</div><div id="hp"><div id="hpf"></div></div></div>
</div>
<div id="pads"><div class="pad" id="pl">&#9664;</div><div class="pad" id="pr">&#9654;</div><div class="pad" id="pj">&#9650;</div></div>
<div id="ov">
  <div id="ttl">POLY<b>BIUS</b></div>
  <div id="sub2">TOWER &mdash; 3 LIVES</div>
  <div id="nowp">&nbsp;</div>
  <div id="msg">The tower does not end. Climb until your lives run out.<br>
   Every metre scores. <span class="k">Blue cells</span> raise your multiplier.</div>
  <div id="board"><div class="bh">HIGH SCORES</div><div id="rows"></div></div>
  <button id="coin">INSERT COIN</button>
  <div id="blink">1 CREDIT &mdash; PRESS START</div>
</div>
<script>
(function(){
/* ============== CONFIG ============== */
var CANDIDATES=['Song.mp3'];


var TRACK_TITLE='INSERT COINS, INVERT MINDS';
var VOL_MENU=0.85, VOL_GAME=0.52;

/* ============== AUDIO ============== */
var AC=null,master=null,sfxG=null,synthG=null,noiseBuf=null;
var soundOn=true,crushOn=true;
var trackEl=null,srcNode=null,cleanG=null,crushG=null,crusher=null,crushLP=null;
var usingTrack=false,inGame=false,foundName='';
var bSnd=document.getElementById('bSnd'),bCr=document.getElementById('bCr');
var lSnd=document.getElementById('lSnd'),nowp=document.getElementById('nowp');

function initAudio(){
  if(AC) return;
  var Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx) return;
  AC=new Ctx();
  master=AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
     sfxG=AC.createGain();  sfxG.gain.value=0.34; sfxG.connect(master);
  synthG=AC.createGain(); synthG.gain.value=0.30; synthG.connect(master);
  var n=AC.sampleRate*2; noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
  var d=noiseBuf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
}
function resumeAudio(){ if(AC&&AC.state==='suspended') AC.resume(); }

/* ---- find the audio file by trying each candidate name ---- */
var probeIdx=0;
function probeNext(done){
  done(CANDIDATES[0]);
}


/* ---- bitcrusher via ScriptProcessor ---- */
function makeCrusher(){
  var bits=6, norm=Math.pow(2,bits-1), step=4;  // step = downsample factor
  var node=(AC.createScriptProcessor||AC.createJavaScriptNode).call(AC,1024,2,2);
  var hold=[0,0], cnt=0;
  node.onaudioprocess=function(e){
    var ch;
    for(ch=0;ch<e.inputBuffer.numberOfChannels;ch++){
      var inp=e.inputBuffer.getChannelData(ch);
      var out=e.outputBuffer.getChannelData(ch);
      for(var i=0;i<inp.length;i++){
        if(ch===0){ if(i%step===0){ hold[0]=Math.round(inp[i]*norm)/norm; } out[i]=hold[0]; }
        else      { if(i%step===0){ hold[1]=Math.round(inp[i]*norm)/norm; } out[i]=hold[1]; }
      }
    }
  };
  return node;
}
function buildMusicChain(){
  if(!AC||!trackEl) return;
  if(srcNode){ setCrushed(inGame); return; }

  try{
    srcNode=AC.createMediaElementSource(trackEl);
  }catch(e){ srcNode=null; return; }
  cleanG=AC.createGain(); cleanG.gain.value=1;
  crushG=AC.createGain(); crushG.gain.value=0;
  crusher=makeCrusher();
  crushLP=AC.createBiquadFilter(); crushLP.type='lowpass'; crushLP.frequency.value=3400; crushLP.Q.value=0.7;
  // clean path
  srcNode.connect(cleanG); cleanG.connect(master);
  // crushed path
  srcNode.connect(crusher); crusher.connect(crushLP); crushLP.connect(crushG); crushG.connect(master);
}
function setCrushed(on){
  if(!cleanG||!crushG){ return; }
  var t=AC.currentTime, r=0.35;
  var wantCrush = on && crushOn;
  cleanG.gain.cancelScheduledValues(t);
  crushG.gain.cancelScheduledValues(t);
  cleanG.gain.setTargetAtTime(wantCrush?0:1, t, r/3);
  crushG.gain.setTargetAtTime(wantCrush?1:0, t, r/3);
}

/* ---- chip sfx ---- */
function blip(f,dur,type,vol,to){
  if(!AC||!soundOn) return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,AC.currentTime);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(30,to),AC.currentTime+dur);
  g.gain.setValueAtTime(0.0001,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.25,AC.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g); g.connect(sfxG); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noise(dur,vol,f,type){
  if(!AC||!soundOn||!noiseBuf) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf;
  var fl2=AC.createBiquadFilter(); fl2.type=type||'bandpass'; fl2.frequency.value=f||900; fl2.Q.value=1.1;
  var g=AC.createGain();
  g.gain.setValueAtTime(vol||0.3,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.connect(fl2); fl2.connect(g); g.connect(sfxG); s.start(); s.stop(AC.currentTime+dur+0.02);
}
var SFX={
  jump:function(){blip(330,0.13,'square',0.16,620);},
  land:function(){noise(0.07,0.15,420,'lowpass');},
  hurt:function(){blip(220,0.20,'sawtooth',0.26,90);noise(0.12,0.2,300,'lowpass');},
  fatal:function(){blip(160,0.42,'sawtooth',0.32,50);noise(0.30,0.28,220,'lowpass');},
  cell:function(m){var b=660*Math.pow(1.06,Math.min(m*2,14));
   blip(b,0.09,'square',0.20);setTimeout(function(){blip(b*1.5,0.11,'square',0.17);},70);},
  bank:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){blip(f,0.12,'triangle',0.18);},i*55);});},
  coin:function(){blip(988,0.07,'square',0.24);setTimeout(function(){blip(1319,0.16,'square',0.22);},70);},
  life:function(){blip(440,0.14,'square',0.22,220);setTimeout(function(){blip(330,0.20,'square',0.20,150);},130);},
  over:function(){[392,330,262,196].forEach(function(f,i){setTimeout(function(){blip(f,0.28,'triangle',0.24);},i*170);});},
  record:function(){[523,659,784,1047,1319].forEach(function(f,i){setTimeout(function(){blip(f,0.16,'square',0.22);},i*90);});},
  thunder:function(){noise(0.9,0.20,180,'lowpass');}
};

/* ---- synth fallback ---- */
var mus={on:false,step:0,timer:null,bpm:76,lvl:0};
var CH=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
var BASS=[110,87.31,130.81,98];
function musicTick(){
  if(!AC||!soundOn||!mus.on) return;
  var bar=Math.floor(mus.step/8)%4,s=mus.step%8,ch=CH[bar];
  if(s===0||s===4){var o=AC.createOscillator(),g=AC.createGain();
   o.type='triangle';o.frequency.value=BASS[bar];
   g.gain.setValueAtTime(0.0001,AC.currentTime);
   g.gain.exponentialRampToValueAtTime(0.34,AC.currentTime+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.42);
   o.connect(g);g.connect(synthG);o.start();o.stop(AC.currentTime+0.45);}
  var pat=[0,1,2,1,0,2,1,2];
  var og=AC.createOscillator(),gg=AC.createGain();
  og.type='square';og.frequency.value=ch[pat[s]]*(s>=4&&mus.lvl>0.45?2:1);
  gg.gain.setValueAtTime(0.0001,AC.currentTime);
  gg.gain.exponentialRampToValueAtTime(0.10+mus.lvl*0.07,AC.currentTime+0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.20);
  og.connect(gg);gg.connect(synthG);og.start();og.stop(AC.currentTime+0.23);
  if(s===0||s===3||s===6){var k=AC.createOscillator(),kg=AC.createGain();
   k.type='sine';k.frequency.setValueAtTime(120,AC.currentTime);
   k.frequency.exponentialRampToValueAtTime(45,AC.currentTime+0.11);
   kg.gain.setValueAtTime(0.30,AC.currentTime);
   kg.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.14);
   k.connect(kg);kg.connect(synthG);k.start();k.stop(AC.currentTime+0.16);}
  if(s%2===1){var hs=AC.createBufferSource();hs.buffer=noiseBuf;
   var hf=AC.createBiquadFilter();hf.type='highpass';hf.frequency.value=6500;
   var hg=AC.createGain();hg.gain.setValueAtTime(0.055,AC.currentTime);
   hg.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.05);
   hs.connect(hf);hf.connect(hg);hg.connect(synthG);hs.start();hs.stop(AC.currentTime+0.06);}
  mus.step++;
}
function synthStart(){if(!AC||mus.on)return;mus.on=true;mus.step=0;
 mus.timer=setInterval(musicTick,(60/mus.bpm)*1000/2);}
function synthStop(){mus.on=false;if(mus.timer){clearInterval(mus.timer);mus.timer=null;}}

/* ---- rain ---- */
var rainSrc=null,rainGain=null;
function rainStart(){
  if(!AC||rainSrc)return;
  rainSrc=AC.createBufferSource();rainSrc.buffer=noiseBuf;rainSrc.loop=true;
  var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=0.35;
  rainGain=AC.createGain();rainGain.gain.value=0.0;
  rainSrc.connect(f);f.connect(rainGain);rainGain.connect(master);rainSrc.start();
}

/* ---- music control ---- */
function menuMusic(){
  if(!soundOn) return;
  if(usingTrack&&trackEl){
    trackEl.volume=1; setCrushed(false);
    if(master) master.gain.value=VOL_MENU;
    trackEl.play().catch(function(){});
    nowp.innerHTML='&#9834; '+TRACK_TITLE+' &mdash; FULL QUALITY';
  }
}
function startTrackForGame(){
  inGame=true;
  if(usingTrack&&trackEl){
    setCrushed(true);
    if(master) master.gain.value=VOL_GAME+0.5;
    if(cleanG) {} // handled by setCrushed
    trackEl.play().catch(function(){});
  } else { synthStart(); }
  if(rainGain) rainGain.gain.setTargetAtTime(0.05,AC.currentTime,0.4);
}
function endTrackForGame(){
  inGame=false;
  if(usingTrack&&trackEl){
    setCrushed(false);
    if(master) master.gain.value=VOL_MENU;
    nowp.innerHTML='&#9834; '+TRACK_TITLE+' &mdash; FULL QUALITY';
  } else { synthStop(); }
  if(rainGain) rainGain.gain.setTargetAtTime(0.0,AC.currentTime,0.5);
}
function setSound(v){
  soundOn=v;
  bSnd.className=v?'ab on':'ab';
  bSnd.querySelector('.ic').innerHTML=v?'&#9834;':'&#9834;&#824;';
  lSnd.textContent=v?'SOUND':'MUTED';
  if(master) master.gain.value=v?(inGame?VOL_GAME+0.5:VOL_MENU):0;
  try{localStorage.setItem('pb_snd',v?'1':'0');}catch(e){}
}
function setCrush(v){
  crushOn=v;
  bCr.className=v?'ab on':'ab';
  setCrushed(inGame);
  try{localStorage.setItem('pb_cr',v?'1':'0');}catch(e){}
}
try{if(localStorage.getItem('pb_snd')==='0')soundOn=false;}catch(e){}
try{if(localStorage.getItem('pb_cr')==='0')crushOn=false;}catch(e){}
bSnd.addEventListener('click',function(e){e.stopPropagation();setSound(!soundOn);});
bCr.addEventListener('click',function(e){e.stopPropagation();setCrush(!crushOn);});

/* ============== GAME ============== */
var cv=document.getElementById('c'),cx=cv.getContext('2d');
var ov=document.getElementById('ov'),coin=document.getElementById('coin'),pads=document.getElementById('pads');
var elSc=document.getElementById('sc'),elHp=document.getElementById('hpf'),elMul=document.getElementById('mul');
var elLives=document.getElementById('lives'),fl=document.getElementById('fl'),toast=document.getElementById('toast');
var ttl=document.getElementById('ttl'),sub2=document.getElementById('sub2'),msg=document.getElementById('msg');
var rows=document.getElementById('rows'),blink=document.getElementById('blink');
var W=320,H=560,DPR=1;
function resize(){W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
 cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 cx.setTransform(DPR,0,0,DPR,0,0);}
resize();window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,300);});
if(('ontouchstart' in window)||navigator.maxTouchPoints>0)pads.style.display='block';

var GRAV=0.62,MOVE=2.55,JUMP=-11.5,TERM=15.5,PLW=13,PLH=22;
var SAFE=3,HURT=4.5,FATAL=6,PPM=13;
var DEF=[{n:'V.SIKOTIK',s:4200},{n:'ALI3N LEE',s:2650},{n:'T.S.SPECTRE',s:1400}];
var board=[];
function loadBoard(){try{var r=localStorage.getItem('pb_board');if(r)board=JSON.parse(r);}catch(e){}
 if(!board||!board.length)board=DEF.map(function(o){return{n:o.n,s:o.s};});
 board.sort(function(a,b){return b.s-a.s;});board=board.slice(0,5);}
function saveBoard(){try{localStorage.setItem('pb_board',JSON.stringify(board));}catch(e){}}
loadBoard();
function drawBoard(ni){var h='';
 for(var i=0;i<board.length;i++){
  var cls=(i===ni)?'row new':(board[i].you?'row you':'row');
  h+='<div class="'+cls+'"><span>'+(i+1)+'</span><span>'+board[i].n+'</span><span>'+board[i].s+'</span></div>';}
 rows.innerHTML=h;}
drawBoard(-1);

var plats=[],cells=[],st='menu',cam=0,shake=0,gust=0,gustT=0,lit=0;
var p={x:0,y:0,vx:0,vy:0,grd:false,fallY:0,falling:false,hp:100,face:1};
var score=0,mul=1,bestMul=1,peak=0,topY=0,nextSide=0,idx=0,lives=3,respawnT=0;
var K={l:false,r:false,j:false};
function showToast(t,c){toast.textContent=t;toast.style.color=c||'#ffb84a';toast.style.opacity='1';
 setTimeout(function(){toast.style.opacity='0';},700);}
function livesStr(){var s='';for(var i=0;i<3;i++)s+=(i<lives?'\u25CF':'\u25CB');return s;}
function addPlat(){
  var cm=W/2,w,x,t='l',diff=Math.min(peak/300,1);
  w=54-diff*16+Math.random()*(26-diff*10);
  if(idx%6===5){w=64;x=cm-w/2;t='r';}
  else if(nextSide===0){x=cm-w-10-Math.random()*(24+diff*22);}
  else{x=cm+10+Math.random()*(24+diff*22);}
  x=Math.max(5,Math.min(W-w-5,x));
  topY-=62+diff*14+Math.random()*10;
  plats.push({x:x,y:topY,w:w,h:9,t:t});
  if(t!=='r'&&idx%3===1)cells.push({x:x+w/2,y:topY-16,got:false,ph:Math.random()*6});
  nextSide^=1;idx++;
}
function build(){
  plats=[];cells=[];topY=0;idx=0;nextSide=0;
  plats.push({x:-80,y:0,w:W+160,h:50,t:'g'});
  for(var i=0;i<24;i++)addPlat();
  p.x=W/2-PLW/2;p.y=-PLH;p.vx=0;p.vy=0;p.hp=100;p.grd=true;p.fallY=0;p.falling=false;
  score=0;mul=1;bestMul=1;peak=0;cam=0;lives=3;elLives.textContent=livesStr();
}
function respawn(){
  var ty=-peak*PPM+120,bp=plats[0],bd=1e9;
  for(var i=0;i<plats.length;i++){var s=plats[i];
   if(s.y>ty-40){var d=Math.abs(s.y-ty);if(d<bd){bd=d;bp=s;}}}
  p.x=bp.x+bp.w/2-PLW/2;p.y=bp.y-PLH-1;p.vx=0;p.vy=0;
  p.hp=100;p.grd=true;p.falling=false;p.fallY=p.y;
  mul=1;respawnT=40;elHp.style.width='100%';
  SFX.life();showToast(lives+' LIVES LEFT','#ff4a4a');
}
function start(){
  initAudio();resumeAudio();rainStart();
  if(usingTrack&&!srcNode) buildMusicChain();
  SFX.coin();
  build();st='play';ov.style.display='none';
  startTrackForGame();
}
coin.addEventListener('click',start);
coin.addEventListener('touchend',function(e){e.preventDefault();start();},{passive:false});
document.addEventListener('keydown',function(e){var k=e.key;
 if(st!=='play'&&(k===' '||k==='Enter')){e.preventDefault();start();return;}
 if(k==='ArrowLeft'||k==='a'||k==='A')K.l=true;
 if(k==='ArrowRight'||k==='d'||k==='D')K.r=true;
 if(k===' '||k==='ArrowUp'||k==='w'||k==='W')K.j=true;
 if(k==='m'||k==='M')setSound(!soundOn);
 if(k==='b'||k==='B')setCrush(!crushOn);
 if(k===' '||k.indexOf('Arrow')===0)e.preventDefault();});
document.addEventListener('keyup',function(e){var k=e.key;
 if(k==='ArrowLeft'||k==='a'||k==='A')K.l=false;
 if(k==='ArrowRight'||k==='d'||k==='D')K.r=false;
 if(k===' '||k==='ArrowUp'||k==='w'||k==='W')K.j=false;});
function bind(id,f){var el=document.getElementById(id);
 function on(e){e.preventDefault();f(true);el.classList.add('on');}
 function off(e){e.preventDefault();f(false);el.classList.remove('on');}
 el.addEventListener('touchstart',on,{passive:false});
 el.addEventListener('touchend',off,{passive:false});
 el.addEventListener('touchcancel',off,{passive:false});
 el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);}
bind('pl',function(v){K.l=v;});bind('pr',function(v){K.r=v;});bind('pj',function(v){K.j=v;});
 /* ===== GAMEPAD SUPPORT ===== */
var padPrev=false;
function pollPad(){
  if(!navigator.getGamepads)return;
  var list=navigator.getGamepads(), gp=null;
  for(var i=0;i<list.length;i++){ if(list[i]){gp=list[i];break;} }
  if(!gp)return;
  function btn(n){return gp.buttons&&gp.buttons[n]&&gp.buttons[n].pressed;}
  var ax=(gp.axes&&gp.axes.length)?gp.axes[0]:0;
  K.l=(ax<-0.28)||btn(14);
  K.r=(ax>0.28)||btn(15);
  K.j=btn(0)||btn(12)||btn(3);
  var conf=btn(0)||btn(1)||btn(9)||btn(8);
  if(conf&&!padPrev&&st!=='play'){ start(); }
  padPrev=conf;
}

document.addEventListener('touchmove',function(e){if(st==='play')e.preventDefault();},{passive:false});

var rain=[];for(var i=0;i<80;i++)rain.push({x:Math.random()*700,y:Math.random()*900,s:5+Math.random()*7,l:9+Math.random()*12});
function loseLife(){lives--;elLives.textContent=livesStr();if(lives<=0)gameOver();else respawn();}
function land(){
  var d=(p.y-p.fallY)/PPM;
  if(d>=FATAL){p.hp-=55;shake=11;mul=1;SFX.fatal();showToast('MULTIPLIER LOST','#ff4a4a');}
  else if(d>=HURT){p.hp-=26;shake=7;SFX.hurt();}
  else if(d>=SAFE){p.hp-=9;shake=3;SFX.land();}
  else SFX.land();
  if(p.hp<=0){p.hp=0;loseLife();}
}
function gameOver(){
  st='dead';endTrackForGame();
  var fin=Math.floor(score),ni=-1;
  for(var i=0;i<board.length;i++)if(board[i].you)delete board[i].you;
  if(board.length<5||fin>board[board.length-1].s){
    board.push({n:'YOU',s:fin,you:true});
    board.sort(function(a,b){return b.s-a.s;});board=board.slice(0,5);
    for(var j=0;j<board.length;j++)if(board[j].you&&board[j].s===fin)ni=j;
    saveBoard();}
  if(ni===0)SFX.record();else SFX.over();
  ttl.innerHTML=(ni===0)?'NEW <b>RECORD</b>':'GAME <b>OVER</b>';
  sub2.textContent=(ni>=0)?'YOU MADE THE BOARD':'POLYBIUS — TOWER';
  msg.innerHTML='<div id="big">'+fin+'</div>'+
   '<span style="font-size:9px;letter-spacing:2px;color:#59637a">FINAL SCORE</span><br><br>'+
   'Peak altitude <span class="k">'+Math.floor(peak)+' m</span> &nbsp; Best multiplier <span class="k">x'+bestMul.toFixed(1)+'</span>';
  drawBoard(ni);
  coin.textContent='INSERT COIN';
  blink.textContent=(ni>=0)?'THE CABINET REMEMBERS':'1 CREDIT — PRESS START';
  ov.style.display='flex';
}
function step(){
  if(respawnT>0)respawnT--;
  gustT--;
  if(gustT<=0){gustT=100+Math.random()*160;gust=(Math.random()<0.5?-1:1)*(0.2+Math.random()*0.34);}
  if(lit>0)lit--;
  if(Math.random()<0.005){lit=7;fl.style.opacity='0.42';SFX.thunder();
   setTimeout(function(){fl.style.opacity='0';},70);}
  var ax=0;
  if(K.l){ax-=MOVE;p.face=-1;}
  if(K.r){ax+=MOVE;p.face=1;}
  var alt=-p.y/PPM;
  if(alt>peak){score+=(alt-peak)*mul;peak=alt;}
  mus.lvl=Math.min(peak/260,1);
  if(rainGain)rainGain.gain.value=0.05+mus.lvl*0.045;
  p.vx=ax+(alt>14?gust:0);
  if(K.j&&p.grd){p.vy=JUMP;p.grd=false;p.fallY=p.y;p.falling=true;SFX.jump();}
  p.vy=Math.min(p.vy+GRAV,TERM);
  if(!p.grd&&p.vy>0&&!p.falling){p.falling=true;p.fallY=p.y;}
  p.x+=p.vx;
  if(p.x<2)p.x=2;
  if(p.x>W-PLW-2)p.x=W-PLW-2;
  var py=p.y;p.y+=p.vy;p.grd=false;
  for(var i=0;i<plats.length;i++){
    var s=plats[i];
    if(p.x+PLW>s.x&&p.x<s.x+s.w){
      if(py+PLH<=s.y+2&&p.y+PLH>=s.y&&p.vy>=0){
        p.y=s.y-PLH;p.vy=0;p.grd=true;
        if(p.falling){p.falling=false;land();}
        if(s.t==='r'&&mul>bestMul){bestMul=mul;SFX.bank();showToast('BANKED x'+mul.toFixed(1),'#5affa8');}
      }}}
  if(p.y>-peak*PPM+H*1.25){p.hp=0;loseLife();}
  for(var j=0;j<cells.length;j++){
    var q=cells[j];
    if(!q.got&&Math.abs(p.x+PLW/2-q.x)<18&&Math.abs(p.y+PLH/2-q.y)<20){
      q.got=true;mul+=0.5;score+=25*mul;shake=2;
      if(mul>bestMul)bestMul=mul;
      SFX.cell(mul);showToast('x'+mul.toFixed(1),'#5ad8ff');}}
  while(topY-cam>-H*1.6)addPlat();
  if(plats.length>90)plats.splice(1,20);
  if(cells.length>40)cells.splice(0,15);
  var tg=p.y-H*0.62;cam+=(tg-cam)*0.09;
  if(cam>-H+90)cam=-H+90;
  if(shake>0)shake*=0.86;
  elSc.textContent=Math.floor(score);
  elMul.textContent='x'+mul.toFixed(1);
  elHp.style.width=Math.max(0,p.hp)+'%';
}
function draw(){
  var sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  cx.save();cx.translate(sx,sy);
  var deep=Math.min(peak/420,1);
  var g=cx.createLinearGradient(0,0,0,H);
  if(lit>0){g.addColorStop(0,'#2a3550');g.addColorStop(1,'#141a28');}
  else{g.addColorStop(0,'rgb('+Math.floor(8+deep*22)+','+Math.floor(10+deep*8)+','+Math.floor(18+deep*34)+')');
       g.addColorStop(1,'#04050a');}
  cx.fillStyle=g;cx.fillRect(-20,-20,W+40,H+40);
  if(deep>0.25){cx.fillStyle='rgba(200,220,255,'+((deep-0.25)*0.5)+')';
   for(var s2=0;s2<40;s2++)cx.fillRect((s2*97)%W,(s2*53)%H,1,1);}
  cx.strokeStyle='rgba(150,180,220,.16)';cx.lineWidth=1;cx.beginPath();
  for(var i=0;i<rain.length;i++){var r=rain[i];r.y+=r.s;r.x-=1.7;
   if(r.y>H){r.y=-14;r.x=Math.random()*(W+60);}
   if(r.x<-20)r.x=W+20;cx.moveTo(r.x,r.y);cx.lineTo(r.x-2.5,r.y+r.l);}
  cx.stroke();
  cx.save();cx.translate(0,-cam);
  cx.strokeStyle='rgba(70,86,112,.42)';cx.lineWidth=3;
  cx.beginPath();cx.moveTo(W/2-16,50);cx.lineTo(W/2-16,topY);cx.stroke();
  cx.beginPath();cx.moveTo(W/2+16,50);cx.lineTo(W/2+16,topY);cx.stroke();
  cx.strokeStyle='rgba(70,86,112,.22)';cx.lineWidth=2;
  for(var y=Math.min(50,cam+H*2);y>Math.max(topY,cam-60);y-=26){
    cx.beginPath();cx.moveTo(W/2-16,y);cx.lineTo(W/2+16,y-13);cx.stroke();
    cx.beginPath();cx.moveTo(W/2+16,y);cx.lineTo(W/2-16,y-13);cx.stroke();}
  for(var k=0;k<plats.length;k++){
    var s=plats[k];
    if(s.y-cam<-80||s.y-cam>H+80)continue;
    if(s.t==='g'){cx.fillStyle='#0d1119';cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#1b2231';cx.fillRect(s.x,s.y,s.w,3);}
    else if(s.t==='r'){cx.fillStyle='#1d3a2e';cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#5affa8';cx.fillRect(s.x,s.y,s.w,2);}
    else{cx.fillStyle='#1a212e';cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#2c3646';cx.fillRect(s.x,s.y,s.w,2);}}
  for(var n=0;n<cells.length;n++){
    var q=cells[n];
    if(q.got||q.y-cam<-60||q.y-cam>H+60)continue;
    q.ph+=0.08;
    cx.save();cx.translate(q.x,q.y+Math.sin(q.ph)*3);
    cx.shadowColor='#5ad8ff';cx.shadowBlur=13;cx.fillStyle='#5ad8ff';
    cx.fillRect(-5,-5,10,10);cx.shadowBlur=0;
    cx.fillStyle='#04121a';cx.fillRect(-2,-2,4,4);cx.restore();}
  if(!(respawnT>0&&Math.floor(respawnT/4)%2===0)){
    cx.save();cx.translate(p.x,p.y);
    cx.fillStyle='#11151d';cx.fillRect(0,6,PLW,PLH-6);
    cx.fillStyle='#1b2230';cx.fillRect(0,6,PLW,4);
    cx.fillStyle='#c9a86a';cx.fillRect(PLW/2-1,9,2,6);
    cx.fillStyle='#2a3040';cx.fillRect(1,0,PLW-2,7);
    cx.shadowColor='#5ad8ff';cx.shadowBlur=9;cx.fillStyle='#7ce4ff';
    cx.fillRect(p.face>0?PLW-5:2,2,3,2);
    cx.restore();}
  cx.restore();cx.restore();
}
function loop(){pollPad();if(st==='play'){step();draw();}requestAnimationFrame(loop);}


/* ---- boot: find the file, then set the menu up ---- */
setSound(soundOn); setCrush(crushOn);
probeNext(function(name){
  if(name){
    foundName=name; usingTrack=true;
    trackEl=new Audio(); trackEl.src=name; trackEl.loop=true; trackEl.preload='auto';
    trackEl.crossOrigin='anonymous';
    trackEl.load();
    nowp.innerHTML='&#9834; '+TRACK_TITLE+' &mdash; TAP TO HEAR IT';
  } else {
    usingTrack=false;
    nowp.innerHTML='&#9834; CHIPTUNE MODE &mdash; no audio file found';
  }
});
// first user gesture anywhere unlocks + starts menu music
function firstGesture(){
  initAudio(); resumeAudio();
  if(usingTrack&&!srcNode){ buildMusicChain(); }
  if(st==='menu'||st==='dead') menuMusic();
  document.removeEventListener('touchstart',firstGesture);
  document.removeEventListener('mousedown',firstGesture);
  document.removeEventListener('keydown',firstGesture);
}
document.addEventListener('touchstart',firstGesture,{passive:true});
document.addEventListener('mousedown',firstGesture);
document.addEventListener('keydown',firstGesture);

build(); st='menu'; loop();
})();
